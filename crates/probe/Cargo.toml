[package]
name    = "probe"
version = "0.1.0"
edition = "2021"

[lib]
name = "probe"
path = "src/lib.rs"

[dependencies]
ts  = { path = "../ts" }
net = { path = "../net" }

bytes             = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
toml              = { workspace = true }
crossbeam-channel = { workspace = true }
tracing           = { workspace = true }
chrono            = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[dev-dependencies]
tempfile = "3"
socket2  = "0.5"
